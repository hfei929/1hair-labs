name: mirror-waline
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: GHCR login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: mirror
        run: |
          docker pull lizheming/waline:latest
          docker tag lizheming/waline:latest ghcr.io/hfei929/waline:latest
          docker push ghcr.io/hfei929/waline:latest

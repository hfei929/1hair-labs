name: build-user-sim

on:
  push:
    branches: [main]
    paths:
      - "tools/user-sim/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/user-sim
          provenance: false
          push: true
          tags: |
            ghcr.io/hfei929/1hair-user-sim:latest
            ghcr.io/hfei929/1hair-user-sim:sha-${{ github.sha }}

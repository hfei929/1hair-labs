site_name: 1hair-labs | 一根头发丝的宽度
site_description: Kubernetes、Linux、Prometheus、Grafana、ESXi、vCenter、vSAN、PVE 运维实践与成长记录
site_author: hfei
site_url: https://1hairlabs.cn

# repo_name: hfei929/1hair-labs
# repo_url: https://github.com/hfei929/1hair-labs

copyright: Copyright © 2026 一根头发丝的宽度

theme:
  # name: dracula
  name: material
  language: zh
  
  custom_dir: overrides

  logo: assets/1hairlabs-logo.png
  favicon: assets/1hairlabs-favicon.png

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    
    - search.highlight
    - search.share
    - search.suggest
    
    - content.code.copy
    - content.code.annotate
    
    - toc.follow

  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

  font:
    text: Roboto
    code: Roboto Mono
  
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/hfei929

nav:

  - 首页: index.md

  - Linux:
      - 概览: linux/index.md
      - Linux 和系统安装简介: linux/linux-and-system-installation.md
      - Linux 目录结构说明: linux/linux-directory-structure.md
      - Linux 常用命令: linux/common-commands.md
      - Linux 完整命令: linux/all-commands.md
      - Linux 存储管理: linux/storage.md
      - Linux 网络管理: linux/network.md
      - Linux 用户和权限管理: linux/user-and-permission.md
      - Linux 软件包管理: linux/package-management.md
      - Linux 系统监控: linux/system-monitoring.md
      - Linux 系统日志管理: linux/log-management.md
      - Linux 系统安全: linux/security.md
      - Linux 系统性能优化: linux/performance-optimization.md
      - Linux 系统故障排除: linux/troubleshooting.md
      - Linux 应急响应: linux/incident-response.md

  - Kubernetes:
      - 概览: kubernetes/index.md
      - 从入门到生产: kubernetes/K8s-beginner-to-production.md
      - 从单 Master 到生产级高可用架构思考: kubernetes/single-master-to-ha.md
      - 高可用集群: kubernetes/ha-cluster.md
      - Ingress: kubernetes/ingress.md
      - 网络: kubernetes/network.md
      - Docker 详细使用教程: kubernetes/docker.md

  - Monitoring:
      - 概览: monitoring/index.md
      - K8s 集群监控健康检查指标: monitoring/k8s-cluster-health-check.md
      - Prometheus: monitoring/prometheus.md
      - Grafana: monitoring/grafana.md
      - Alertmanager: monitoring/alertmanager.md

  - 虚拟化与云原生:
      - 概览: virtualization/index.md
      - Docker: virtualization/index.md

  - 故障实验室:
      - 概览: lab/index.md
      - HA故障演练: lab/failover-test.md
      - ETCD 恢复: lab/etcd-recovery.md

  - 故障排除:
      - 概览: troubleshooting/index.md

  - 技术服务:
      - 服务介绍: service/index.md

  - 关于我:
      - 个人介绍: about/index.md

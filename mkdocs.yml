site_name: 1hair-labs | 一根头发丝的宽度
site_description: Kubernetes、Linux、Prometheus、Grafana、ESXi、vCenter、vSAN、PVE 运维实践与成长记录
site_author: hfei
site_url: https://1hairlabs.cn

# repo_name: hfei929/1hair-labs
# repo_url: https://github.com/hfei929/1hair-labs

copyright: Copyright © 2026 一根头发丝的宽度

theme:
  # name: dracula
  name: material
  language: zh
  
  custom_dir: overrides

  logo: assets/1hairlabs-logo.png
  favicon: assets/1hairlabs-favicon.png

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    
    - search.highlight
    - search.share
    - search.suggest
    
    - content.code.copy
    - content.code.annotate
    
    - toc.follow

  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式

  font:
    text: Roboto
    code: Roboto Mono
  
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/hfei929


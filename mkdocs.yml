site_name: 1HairLabs
site_url: https://1hairlabs.cn
site_author: 1HairLabs
site_description: >
  专注于 Kubernetes、Linux、Docker、云原生、可观测性与企业级基础设施，提供系统化教程、实践实验、故障排查及技术知识库。

copyright: Copyright © 2026 1HairLabs · 一根头发丝的宽度 All Rights Reserved.

theme:
  name: material
  language: zh
  
  custom_dir: overrides

  logo: assets/1hairlabs-logo.png
  favicon: assets/1hairlabs-favicon.png

  features:
    # 左侧导航
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.prune
    
    # 搜索
    - search.highlight
    - search.share
    - search.suggest
    
    # 内容
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

    # 目录
    - toc.follow

  palette:
    
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
#    - scheme: default
#      primary: blue
#      accent: indigo
#      toggle:
#        icon: material/weather-night
#        name: 切换深色模式
#    
#    - scheme: slate
#      primary: blue
#      accent: indigo
#      toggle:
#        icon: material/weather-sunny
#        name: 切换浅色模式

  font:
    text: Roboto
    code: Roboto Mono
  
  icon:
    repo: fontawesome/brands/github

# 插件
plugins:
  - search
  - tags
  - glightbox # 引用图片放大
  - blog

  - minify:
      minify_html: true

# markdown 增强
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

  - pymdownx.magiclink

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji

  - toc:
      permalink: true

extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hfei929

    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/

    - icon: fontawesome/brands/weixin
      link: https://1hairlabs.cn

    - icon: material/rss
      link: /feed_rss_created.xml

extra_css:
  - stylesheets/mermaid.css

extra_javascript:
  - javascripts/mermaid.js

